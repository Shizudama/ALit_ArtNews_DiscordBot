name: scout

on:
  schedule:
    # 30分ごとに実行 (UTC)。
    # 注意: GitHub Actionsの定期実行は遅延・スキップが起きうる仕様。
    # 重要なリアルタイム性が必要ならcron-job.org等から workflow_dispatch を叩く方法もあり。
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # 手動実行を可能に

permissions:
  contents: write  # state.json を commit 戻すため

# 同時実行を防止 (前回がまだ走っている時は新しい実行をスキップ)
concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scout
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Commit state if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
